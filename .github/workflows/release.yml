name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Electron Executables
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            electron/package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Validate release version and updater tests
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $electronVersion = (Get-Content electron/package.json | ConvertFrom-Json).version
          $frontendVersion = (Get-Content frontend/package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $electronVersion -or $tagVersion -ne $frontendVersion) {
            throw "Release tag v$tagVersion must match Electron ($electronVersion) and frontend ($frontendVersion)."
          }
          node electron/test-install-lifecycle.js
          node electron/test-update-version.js
          node electron/test-tenant-data-root.js
          node electron/test-hardware-fingerprint.js
          node electron/test-license-activation.js
          pwsh -File electron/scripts/test-installer-safety.ps1

      - name: Install Backend Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Run backend regression tests
        shell: pwsh
        run: |
          python -m pip install pytest
          Push-Location backend
          try { python -m pytest tests -q --basetemp "$env:RUNNER_TEMP\estore-pytest" }
          finally { Pop-Location }

      - name: Build Backend Executable (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onedir --name IStoreBackend --distpath "electron/backend-dist" --workpath "electron/build-backend" --specpath "electron/build-backend" --paths "backend" --hidden-import app.main --hidden-import sync_schema --collect-all certifi --collect-all passlib --collect-submodules app --collect-data app "backend/desktop_server.py"

      - name: Verify packaged backend and reject embedded business data
        shell: pwsh
        run: |
          $bundle = Resolve-Path "electron/backend-dist/IStoreBackend/IStoreBackend.exe"
          $forbidden = Get-ChildItem "electron/backend-dist/IStoreBackend" -Recurse -File | Where-Object {
            $_.Name -in @("istore.db", "license_cache.json")
          }
          if ($forbidden) { throw "Packaged backend contains business or license data: $($forbidden.FullName -join ', ')" }
          $testRoot = Join-Path $env:RUNNER_TEMP "estore-release-smoke"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          $env:ISTORE_DATA_ROOT = $testRoot
          $env:SQLITE_FILE = Join-Path $testRoot "database/istore.db"
          $env:LICENSE_CACHE_FILE = Join-Path $testRoot "license_cache.json"
          $process = Start-Process -FilePath $bundle -WorkingDirectory (Split-Path $bundle) -WindowStyle Hidden -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/health -TimeoutSec 2).StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {}
            }
            if (-not $healthy) { throw "Packaged backend failed its health check." }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend Dist to Electron
        run: |
          if (Test-Path "electron/frontend-dist") { Remove-Item "electron/frontend-dist" -Recurse -Force }
          Copy-Item -Path "frontend/dist" -Destination "electron/frontend-dist" -Recurse

      - name: Install Electron Dependencies
        run: |
          cd electron
          npm ci

      - name: Install WhatsApp Service Dependencies
        run: |
          cd whatsapp_service
          npm ci

      - name: Build Installer
        id: signing
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Set both Windows code-signing secrets or neither."
          }
          if (-not $hasCertificate) { throw "Windows code-signing secrets are required for customer releases." }
          "enabled=$($hasCertificate.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          cd electron
          npm run package

      - name: Verify installer signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $installers = Get-ChildItem "dist-electron" -Filter "*.exe" -File
          if (-not $installers) { throw "No installer executable was produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") { throw "Installer signature is not valid: $($installer.Name) ($($signature.Status))" }
          }

      - name: Upload Draft Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $installer = "dist-electron/E-Store-Setup-$version.exe"
          $metadata = "dist-electron/latest.yml"
          if (-not (Test-Path $installer) -or -not (Test-Path $metadata)) {
            throw "Installer or updater metadata is missing."
          }
          $assets = @($installer, $metadata)
          $blockmap = "$installer.blockmap"
          if (Test-Path $blockmap) { $assets += $blockmap }
          gh release create "${{ github.ref_name }}" @assets --draft --title "E Store $version" --notes "Desktop update with startup and account recovery fixes."
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload the draft release." }

      - name: Verify updater release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
          $required = @("E-Store-Setup-${{ github.ref_name }}.exe".Replace("v", ""), "latest.yml")
          foreach ($name in $required) {
            if ($assets -notcontains $name) { throw "Release asset missing: $name" }
          }

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
